name: Start adapter test services
description: Start and smoke-test the external services used by adapter specs.
inputs:
  services:
    description: Comma-separated adapter names to start (couch_potato,mongoid).
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Start CouchDB
      if: contains(inputs.services, 'couch_potato')
      uses: iamssen/couchdb-github-action@51f21cb519b7ef0cbf86d063849da780dd3ea405
      with:
        couchdb-version: "3"

    - name: Start MongoDB
      if: contains(inputs.services, 'mongoid')
      uses: supercharge/mongodb-github-action@1.12.1
      with:
        mongodb-version: "8.0"

    - name: Smoke-test CouchDB
      if: contains(inputs.services, 'couch_potato')
      shell: bash
      run: |
        curl -f http://127.0.0.1:5984/
        curl -X POST -H "Content-Type: application/json; charset=utf-8" -d '{"name": "admin", "password": "password"}' http://127.0.0.1:5984/_session
